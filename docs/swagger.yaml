definitions:
  models.ConversationDetail:
    properties:
      id:
        type: string
      messages:
        items:
          $ref: '#/definitions/models.Message'
        type: array
      title:
        type: string
    type: object
  models.ConversationSummary:
    properties:
      created_at:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  models.Message:
    properties:
      content:
        type: string
      filename:
        type: string
      role:
        type: string
    type: object
  models.Preset:
    properties:
      id:
        type: string
      label:
        type: string
      text:
        type: string
    type: object
info:
  contact: {}
  description: API documentation for the assistant-controller-chatbot service.
  title: Assistant Controller Chatbot API
  version: "1.0"
paths:
  /chat:
    post:
      consumes:
      - multipart/form-data
      description: Omit conversation_id to start a new chat; include it to continue
        one. A .csv file (optional, 300KB max) may only be attached when starting
        a new chat.
      parameters:
      - description: User ID
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Message
        in: formData
        name: query
        required: true
        type: string
      - description: Conversation ID
        in: formData
        name: conversation_id
        type: string
      - description: CSV attachment (300KB max)
        in: formData
        name: file
        type: file
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send a message (streams the reply as SSE)
      tags:
      - chat
  /conversations:
    get:
      parameters:
      - description: User ID
        in: header
        name: X-User-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ConversationSummary'
            type: array
      summary: List the user's conversations
      tags:
      - conversations
  /conversations/{id}:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: User ID
        in: header
        name: X-User-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ConversationDetail'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Open a conversation and load its history
      tags:
      - conversations
  /ping:
    get:
      description: Returns pong to confirm the server is alive
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ping the server
      tags:
      - health
  /presets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Preset'
            type: array
      summary: List the available preset analysis prompts
      tags:
      - presets
swagger: "2.0"
